<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#fee2e2"/>

  <!-- Body -->
  <ellipse cx="16" cy="19" rx="11" ry="9.5" fill="#f87171"/>

  <!-- Snout -->
  <ellipse cx="24" cy="20.5" rx="4" ry="3.2" fill="#fca5a5"/>
  <!-- Nostrils -->
  <circle cx="22.8" cy="20.5" r="0.8" fill="#dc2626"/>
  <circle cx="25.2" cy="20.5" r="0.8" fill="#dc2626"/>

  <!-- Ear -->
  <ellipse cx="12" cy="10.5" rx="3" ry="2.2" fill="#ef4444" transform="rotate(-15 12 10.5)"/>
  <ellipse cx="12" cy="10.5" rx="1.8" ry="1.3" fill="#fca5a5" transform="rotate(-15 12 10.5)"/>

  <!-- Eye -->
  <circle cx="17.5" cy="15.5" r="1.4" fill="white"/>
  <circle cx="18" cy="16" r="0.7" fill="#1f2937"/>

  <!-- Coin slot -->
  <rect x="13" y="9.5" width="6" height="1.4" rx="0.7" fill="#b91c1c"/>

  <!-- Legs -->
  <rect x="10" y="27" width="3.5" height="4" rx="1.75" fill="#ef4444"/>
  <rect x="15" y="27.5" width="3.5" height="3.5" rx="1.75" fill="#ef4444"/>

  <!-- Tail -->
  <path d="M5 19 C2 17.5, 2 23, 5.5 21.5" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Coin -->
  <circle cx="27" cy="8" r="3.5" fill="#fbbf24"/>
  <text x="27" y="10.2" font-family="sans-serif" font-size="5" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
</svg>
